name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. v1.2.3)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  ESP32_INDEX: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.4.1'

      # Core 2.0.17: the TFT_eSPI in libraries/ is the version this firmware was built and tested with.
      - name: Install core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls "$ESP32_INDEX"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-property "compiler.cpp.extra_flags=-DFW_VERSION=\"${VERSION}\"" \
            --libraries libraries \
            --output-dir build/out .

      - name: Collect binaries
        run: |
          mkdir -p firmware
          pip install esptool==4.8.1
          esptool.py --chip esp32 merge_bin -o firmware/Antenna-Remote.bin \
            --flash_mode keep --flash_size 4MB \
            0x1000 build/out/Antenna-Remote.ino.bootloader.bin \
            0x8000 build/out/Antenna-Remote.ino.partitions.bin \
            0x10000 build/out/Antenna-Remote.ino.bin
          cp build/out/Antenna-Remote.ino.bin firmware/Antenna-Remote_ota.bin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            firmware/Antenna-Remote.bin firmware/Antenna-Remote_ota.bin \
            --title "$VERSION" --generate-notes
